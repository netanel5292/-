<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jew Jitsu CEO</title>
<style>
:root{
  --bg:#f4f2ee;--panel:#ffffff;--panel2:#faf8f4;--ink:#1d1b18;--muted:#6d665c;--line:#e3ddd2;
  --accent:#b3261e;--accent2:#c99a2e;--good:#1f7a4d;--bad:#c0362c;--warn:#b7791f;--info:#2f5fa8;
  --s-sample:#7a4bb3;--s-unv:#b7791f;--s-ver:#1f7a4d;
  --c1:#b3261e;--c2:#2f5fa8;--c3:#c99a2e;--c4:#1f7a4d;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14130f;--panel:#1e1c18;--panel2:#25231e;--ink:#f1ede5;--muted:#a59d90;--line:#36322b;
  --accent:#e0554b;--accent2:#e0b44f;--good:#4fbf87;--bad:#ef6a5f;--warn:#e0a443;--info:#6f9be0;
  --s-sample:#b08ae6;--s-unv:#e0a443;--s-ver:#4fbf87;--c1:#e0554b;--c2:#6f9be0;--c3:#e0b44f;--c4:#4fbf87;
  --shadow:none;}}
:root[data-theme="dark"]{
  --bg:#14130f;--panel:#1e1c18;--panel2:#25231e;--ink:#f1ede5;--muted:#a59d90;--line:#36322b;
  --accent:#e0554b;--accent2:#e0b44f;--good:#4fbf87;--bad:#ef6a5f;--warn:#e0a443;--info:#6f9be0;
  --s-sample:#b08ae6;--s-unv:#e0a443;--s-ver:#4fbf87;--c1:#e0554b;--c2:#6f9be0;--c3:#e0b44f;--c4:#4fbf87;--shadow:none;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Arial,"Noto Sans Hebrew",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.brand{font-weight:800;font-size:18px;letter-spacing:.2px}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.hsp{flex:1}
.save{font-size:12px;color:var(--muted)}
.save.ok{color:var(--good)}.save.err{color:var(--bad)}
nav{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px 0}
nav button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;font-weight:600}
nav button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
nav .cnt{display:inline-block;min-width:18px;padding:0 5px;margin-inline-start:4px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;text-align:center}
main{padding:14px 16px 60px;max-width:1280px;margin:0 auto}
h2{font-size:18px;margin:18px 0 10px}
h3{font-size:15px;margin:0 0 8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.two{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.tile{position:relative;display:flex;flex-direction:column;gap:4px}
.tile .t{font-size:13px;color:var(--muted);font-weight:600;display:flex;gap:6px;align-items:center;justify-content:space-between}
.tile .v{font-size:28px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums}
.tile .s{font-size:12.5px;color:var(--muted)}
.tile.hl{border-color:var(--accent)}
.tile.samp{background:repeating-linear-gradient(135deg,var(--panel),var(--panel) 10px,var(--panel2) 10px,var(--panel2) 20px)}
.pm{display:flex;gap:6px;margin-top:6px;align-items:center}
.pm button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);font-size:18px;font-weight:700;line-height:1}
.pm button:active{transform:scale(.95)}
.pm .lbl{font-size:11.5px;color:var(--muted)}
.pos{color:var(--good)}.neg{color:var(--bad)}.wrn{color:var(--warn)}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;border:1px solid currentColor;white-space:nowrap;background:transparent;cursor:pointer}
.b-sample{color:var(--s-sample)}.b-unverified{color:var(--s-unv)}.b-verified{color:var(--s-ver)}
.tag{display:inline-block;font-size:11.5px;border-radius:6px;padding:0 6px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.bar{height:8px;border-radius:5px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--accent)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:6px 12px;font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{padding:3px 9px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.chart{width:100%;height:auto;display:block;direction:ltr}
.chart text{fill:var(--muted);font-size:11px;font-family:inherit}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12.5px;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-inline-end:5px;vertical-align:middle}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:start;vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:700}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl{overflow-x:auto}
.hbar{display:grid;grid-template-columns:minmax(90px,170px) 1fr auto;gap:6px 10px;align-items:center;font-size:13px}
.hbar .tr{height:12px;background:var(--panel2);border-radius:6px;overflow:hidden}
.hbar .tr i{display:block;height:100%;background:var(--c2);border-radius:6px}
.morning{border:2px solid var(--accent2)}
.mitem{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line)}
.mitem:last-child{border-bottom:0}
.mnum{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent2);color:#1d1b18;font-weight:800;display:grid;place-items:center}
.mitem.done .mtxt{text-decoration:line-through;opacity:.55}
.chk{display:flex;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line)}
.chk input{width:22px;height:22px;accent-color:var(--good);flex:none}
.chk.done .ct{text-decoration:line-through;opacity:.55}
.ct{flex:1;min-width:0}
.kanban{display:grid;grid-template-columns:repeat(var(--cols),minmax(220px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.kcol{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px;min-height:140px}
.kcol.over{outline:2px dashed var(--accent)}
.kcol h4{margin:2px 4px 8px;font-size:13.5px;display:flex;justify-content:space-between}
.kcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px;cursor:grab;font-size:13.5px}
.kcard.samp{border-style:dashed}
.kcard .kt{font-weight:600;margin-bottom:4px}
.kcard .km{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px;color:var(--muted)}
.kcard select{font-size:12px;padding:1px 2px;border-radius:6px;border:1px solid var(--line);background:var(--panel2)}
.pri-A{color:var(--bad);font-weight:700}.pri-B{color:var(--warn);font-weight:700}.pri-C{color:var(--muted);font-weight:700}
.p80{background:var(--accent);color:#fff;border-radius:6px;padding:0 6px;font-size:11px;font-weight:700}
.due{white-space:nowrap}.due.late{color:var(--bad);font-weight:700}.due.today{color:var(--warn);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chips button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;font-size:13px}
.chips button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
input[type=text],input[type=number],input[type=date],input[type=tel],input[type=search],select,textarea{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:6px 8px;max-width:100%}
input[type=number]{width:110px}
.notice{border-inline-start:4px solid var(--warn);background:var(--panel2);padding:8px 12px;border-radius:8px;font-size:13.5px}
.notice.red{border-color:var(--bad)}.notice.green{border-color:var(--good)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);padding:0;width:min(560px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg{padding:16px}
.dlg label{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin:8px 0 3px}
.dlg input[type=text],.dlg input[type=tel],.dlg input[type=date],.dlg select,.dlg textarea{width:100%}
.dlg .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.dup{margin-top:10px}
.logi{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.logi time{flex:none;color:var(--muted);font-size:12px;width:120px;font-variant-numeric:tabular-nums}
.ctc{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.ctc:hover{background:var(--panel2)}
.ctc.samp{opacity:.8;border-bottom-style:dashed}
.ctc .nm{font-weight:700;min-width:140px}
.hide{display:none!important}
.srcsum{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}
@media (max-width:600px){.tile .v{font-size:24px}.logi time{width:86px}main{padding:12px 12px 60px}}
</style>
</head>
<body>
<header>
  <div class="brand">🥋 Jew Jitsu Ashkelon<small>לוח מנכ"ל + CRM | אב-טיפוס מקומי</small></div>
  <div class="hsp"></div>
  <span id="saveSt" class="save"></span>
  <label class="small row" title="הצג או הסתר רשומות ונתונים שסומנו כדוגמה"><input type="checkbox" id="showSample"> הצג נתוני דוגמה</label>
  <button class="btn sm" data-act="export">⬇ גיבוי לקובץ</button>
  <button class="btn sm" data-act="import">⬆ טעינת גיבוי</button>
  <button class="btn sm" data-act="theme" title="מצב כהה/בהיר">◐</button>
  <input type="file" id="fileIn" accept=".json,application/json" class="hide">
</header>
<nav id="tabs"></nav>
<main id="main"></main>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>

<script>
"use strict";
const KEY='jj_ceo_proto_v1';
const MONTHS=['ינו','פבר','מרץ','אפר','מאי','יוני','יולי','אוג','ספט','אוק','נוב','דצמ'];
const SRC={sample:'דוגמה',unverified:'לאימות',verified:'מאומת'};
const SRC_RANK={sample:0,unverified:1,verified:2};
const CATS=['גיוס','שימור','שיווק','שיתופי פעולה','מקום','כספים','מאמנים','כללי'];
const GROWTH_CATS=['גיוס','שימור','שיווק','שיתופי פעולה'];
const TSTAT=[{id:'todo',l:'לביצוע'},{id:'doing',l:'בתהליך'},{id:'wait',l:'ממתין לאחרים'},{id:'done',l:'בוצע ✓'}];
const TYPES={
  lead:{l:'לידים',one:'ליד',st:['חדש','נוצר קשר','קבע ניסיון','הגיע לניסיון','נרשם','לא רלוונטי'],closed:['נרשם','לא רלוונטי']},
  active:{l:'מתאמנים פעילים',one:'מתאמן/ת',st:['פעיל','בסיכון עזיבה','הקפאה'],closed:[]},
  past:{l:'מתאמני עבר',one:'מתאמן/ת עבר',st:['עזב','להחזיר','לא רלוונטי'],closed:['לא רלוונטי']},
  coach:{l:'מאמנים וצוות',one:'מאמן/צוות',st:['פעיל','מועמד','לא פעיל'],closed:['לא פעיל']},
  partner:{l:'שיתופי פעולה',one:'שותף/ספק',st:['רעיון','בשיחה','ממתין לתשובה','פגישה נקבעה','פעיל','נסגר'],closed:['נסגר']}
};

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtN=n=>Math.round(n).toLocaleString('he-IL');
const nis=n=>(n<0?'−':'')+'₪'+Math.abs(Math.round(n)).toLocaleString('he-IL');
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=s?new Date(s+'T12:00:00'):new Date();d.setDate(d.getDate()+n);return ymd(d)};
const dShort=s=>{if(!s)return'';const [y,m,d]=s.split('-');return `${+d}.${+m}`};
const normName=s=>String(s||'').replace(/[׳'`"״]/g,'').replace(/\s+/g,' ').trim().toLowerCase();
const normPhone=s=>{let p=String(s||'').replace(/\D/g,'');if(p.startsWith('972'))p='0'+p.slice(3);return p};
const worst=(...ss)=>ss.reduce((a,b)=>SRC_RANK[b]<SRC_RANK[a]?b:a,'verified');
function dueCls(d){if(!d)return'';const t=today();return d<t?'late':d===t?'today':''}

  return {
    v:1,showSample:true,buffer:true,
    f:{
      trainees:f('מתאמנים רשומים',56,'unverified',1,'הוזן 21.11 לפי בקשתך. בתיעוד הקודם הופיע 65: לאמת מול Arbox'),

    },
    exp:[
      e('שכירות כולל מע"מ (מ-1.12)',15380,'verified','rent','14,200 עד נובמבר, עולה ב-1.12'),
      e('ארנונה (ציבורית + רגילה)',2500,'verified','arnona'),

      e('תוכנות',200,'verified'),
      e('רואה חשבון',500,'verified'),
      e('Arbox',600,'verified'),
      e('ניקיון',100,'verified'),
      e('ביטוח',0,'unverified','','אין סכום עדיין'),
      e('הוצאות לא ידועות',0,'unverified','other','הוסף כאן כל הוצאה שעוד לא רשומה')
    ],
    debts:[
      {id:uid(),label:'ארנונה בכרטיס אשראי (3 × 6,000)',v:18000,monthly:6000,src:'verified',step:1000,note:'חיובים בדצמבר, ינואר, פברואר'},
      {id:uid(),label:'הלוואות משפחה',v:119800,monthly:0,src:'verified',step:1000,note:'אין החזר חודשי עדיין'},
      {id:uid(),label:'חובות אחרים',v:0,monthly:0,src:'unverified',step:1000,note:''}
    ],
    scen:{mode:'mall',moveIdx:1,rent:7080,arnona:1200,broker:5000},
    contacts:[
      c('lead','הרב גד + קבוצה (4–5)',{interest:'קבוצה: 12% הנחה בהוראת קבע + חבר מביא חבר',status:'נוצר קשר',follow:'2026-11-22',hot:true}),
      c('lead','שי',{interest:'אגרוף קלאסי: ניסיון ב׳ 23.11 18:30',status:'קבע ניסיון',follow:'2026-11-23',hot:true}),
      c('lead','אולגה (אווה 5, שיילין 6)',{interest:'ילדים: לשבץ לניסיון יחד עם יבניה כהן',status:'נוצר קשר',follow:'2026-11-22'}),
      c('lead','יבניה כהן (בת 5)',{interest:'ילדים: אותו ניסיון כמו אולגה',status:'נוצר קשר',follow:'2026-11-22'}),
      c('lead','תהילה שבו (15)',{interest:'מואי תאי',status:'נוצר קשר',follow:'2026-11-22',notes:'לבדוק: האם זו "נערה בת 15: לחזור לאם"?'}),

      c('active','דני (דוגמה)',{status:'בסיכון עזיבה',follow:'2026-11-21',sample:true,notes:'לא הגיע שבועיים',pref:'א׳ ג׳ 19:00'}),
      c('active','מיכל (דוגמה)',{status:'פעיל',sample:true,pref:'ב׳ ד׳ 18:00'}),

/* ---------- state & save ---------- */
let S=load(), TAB='ceo', crmType='lead', crmView='list', crmQ='', taskFilter={cat:'',p80:false,pri:''}, saveState=null;
function load(){
  try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);if(d&&d.f&&d.tasks)return migrate(d)}}catch(e){}
  return seed();
}
function migrate(d){const s=seed();for(const k in s)if(d[k]===undefined)d[k]=s[k];for(const k in s.f)if(!d.f[k])d.f[k]=s.f[k];return d}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S));saveState=new Date()}catch(e){saveState=false}
  const el=$('#saveSt');
  if(saveState===false){el.className='save err';el.textContent='⚠ השמירה במכשיר נכשלה: שמור גיבוי לקובץ'}
  else if(saveState){el.className='save ok';el.textContent='✓ נשמר במכשיר '+saveState.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'})}
}
function log(text,key,ref){
  const now=Date.now(),L=S.log[0];
  if(key&&L&&L.key===key&&now-new Date(L.t).getTime()<60000){L.text=text;L.t=new Date().toISOString();return}
  S.log.unshift({t:new Date().toISOString(),text,key:key||'',ref:ref||''});
  if(S.log.length>1500)S.log.length=1500;
}
function commit(text,key,ref){if(text)log(text,key,ref);save();render()}

/* ---------- calculations ---------- */
const vis=x=>S.showSample||!x.sample;
function expTotal(mig){let s=0;for(const e of S.exp){let v=e.v;if(mig&&e.role==='rent')v=S.scen.rent;if(mig&&e.role==='arnona')v=S.scen.arnona;s+=v}return S.buffer?s*1.1:s}
const otherInc=()=>S.f.priv.v+S.f.sales.v;
const income=t=>t*S.f.avg.v+otherInc();
function breakEven(mig){const need=expTotal(mig)-otherInc();return S.f.avg.v>0?Math.max(0,Math.ceil(need/S.f.avg.v)):Infinity}
const debtTotal=()=>S.debts.reduce((a,d)=>a+d.v,0);
const debtMonthly=()=>S.debts.reduce((a,d)=>a+Math.min(d.monthly||0,d.v),0);
const expSrc=()=>worst(...S.exp.filter(e=>e.v>0||e.src!=='unverified').map(e=>e.src));
function forecast(){
  const rows=[],now=new Date(),rem=S.debts.map(d=>d.v);let t=S.f.trainees.v,cash=S.f.cash.v;
  for(let i=0;i<12;i++){
    const d=new Date(now.getFullYear(),now.getMonth()+1+i,1);
    t=Math.max(0,t+S.f.joins.v-S.f.churn.v);
    const mig=S.scen.mode==='migdal'&&i>=S.scen.moveIdx;
    const exp=expTotal(mig),one=(S.scen.mode==='migdal'&&i===S.scen.moveIdx)?S.scen.broker:0;
    let dp=0;S.debts.forEach((db,j)=>{const p=Math.min(db.monthly||0,rem[j]);rem[j]-=p;dp+=p});
    const inc=income(t),profit=inc-exp;cash+=profit-one-dp;
    rows.push({label:MONTHS[d.getMonth()]+" '"+String(d.getFullYear()).slice(2),t,inc,exp,profit,one,dp,cash,be:breakEven(mig),debt:rem.reduce((a,b)=>a+b,0)});
  }
  return rows;
}
function monthLabel(i){const n=new Date();const d=new Date(n.getFullYear(),n.getMonth()+1+i,1);return MONTHS[d.getMonth()]+" '"+String(d.getFullYear()).slice(2)}

/* ---------- tasks: 80/20 score ---------- */
const score=t=>Math.round(t.impact*t.impact*(6-t.effort)/1.25); // 0–100
const openTasks=()=>S.tasks.filter(t=>t.status!=='done'&&vis(t));
function top20ids(){const o=openTasks().sort((a,b)=>score(b)-score(a));return new Set(o.slice(0,Math.max(1,Math.ceil(o.length*.2))).map(t=>t.id))}
const isClosed=c=>TYPES[c.type].closed.includes(c.status);
const dueContacts=()=>S.contacts.filter(c=>vis(c)&&c.follow&&c.follow<=today()&&!isClosed(c));

/* ---------- morning: 3 highest-impact actions on recruiting & retention ---------- */
function buildMorning(){
  const cand=[];
  for(const c of S.contacts){
    if(!vis(c)||isClosed(c))continue;
    const due=c.follow&&c.follow<=today();
    if(c.type==='active'&&c.status==='בסיכון עזיבה')cand.push({kind:'c',ref:c.id,w:96+(due?2:0),text:`שיחת שימור עם ${c.name}`,why:'מתאמן בסיכון: לשמור אחד קל יותר מלגייס אחד (₪270 בחודש)'});
    else if(c.type==='lead'&&due)cand.push({kind:'c',ref:c.id,w:(c.hot?94:82)+(c.status==='קבע ניסיון'||c.status==='הגיע לניסיון'?3:0),text:`לחזור ל${c.name}`+(c.interest?` (${c.interest})`:''),why:c.hot?'ליד חם עם מועד מעקב היום או באיחור':'מועד מעקב היום או באיחור'});
    else if(c.type==='past'&&c.status==='להחזיר'&&due)cand.push({kind:'c',ref:c.id,w:70,text:`הודעת "מתגעגעים" ל${c.name}`,why:'מתאמן עבר שכבר מכיר את המקום'});
  }
  for(const t of openTasks()){
    if(!GROWTH_CATS.includes(t.cat))continue;
    const late=t.due&&t.due<=today();
    cand.push({kind:'t',ref:t.id,w:score(t)*0.9+(late?8:0)+(t.pri==='A'?5:0),text:t.title,why:`משימת ${t.cat} · ציון השפעה ${score(t)}`+(late?' · מועד היום/באיחור':'')});
  }
  cand.sort((a,b)=>b.w-a.w);
  const seen=new Set(),pick=[];
  for(const x of cand){const k=x.kind+x.ref;if(seen.has(k))continue;seen.add(k);pick.push({...x,done:false});if(pick.length===3)break}
  return pick;
}
function morning(force){
  const d=today();
  if(force||!S.morning[d]){S.morning={[d]:buildMorning()};save()}
  return S.morning[d];
}

/* ---------- charts (inline SVG) ---------- */
function nice(mn,mx,n){const span=mx-mn||1,raw=span/n,p=Math.pow(10,Math.floor(Math.log10(raw))),st=[1,2,2.5,5,10].map(x=>x*p).find(x=>x>=raw)||p*10;const a=Math.floor(mn/st)*st,b=Math.ceil(mx/st)*st;const r=[];for(let v=a;v<=b+st/2;v+=st)r.push(v);return r}
function lineChart(series,labels,o={}){
  const W=660,H=o.h||230,pl=52,pr=14,pt=14,pb=26,fmt=o.fmt||fmtN;
  let all=series.flatMap(s=>s.vals).filter(Number.isFinite);if(o.zero)all.push(0);
  const ticks=nice(Math.min(...all),Math.max(...all),4),mn=ticks[0],mx=ticks[ticks.length-1];
  const x=i=>pl+(W-pl-pr)*i/Math.max(1,labels.length-1),y=v=>pt+(H-pt-pb)*(1-(v-mn)/((mx-mn)||1));
  let g='';
  for(const v of ticks)g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" ${v===0&&o.zero?'stroke-width="2" stroke="var(--muted)"':''}/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${fmt(v)}</text>`;
  labels.forEach((l,i)=>{if(labels.length<=12||i%2===0)g+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${esc(l)}</text>`});
  for(const s of series){
    const pts=s.vals.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
    g+=`<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="${s.w||2.5}" ${s.dash?'stroke-dasharray="6 5"':''} stroke-linejoin="round"/>`;
    if(s.dots)s.vals.forEach((v,i)=>{g+=`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="${s.dotColor?s.dotColor(v):s.color}"><title>${esc(labels[i])}: ${fmt(v)}</title></circle>`});
  }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`+(o.legend!==false?`<div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`:'');
}
function barChart(vals,labels,o={}){
  const W=660,H=o.h||200,pl=52,pr=14,pt=12,pb=26,fmt=o.fmt||fmtN;
  const ticks=nice(Math.min(0,...vals),Math.max(0,...vals),4),mn=ticks[0],mx=ticks[ticks.length-1];
  const y=v=>pt+(H-pt-pb)*(1-(v-mn)/((mx-mn)||1)),bw=(W-pl-pr)/vals.length;let g='';
  for(const v of ticks)g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="${v===0?'var(--muted)':'var(--line)'}"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${fmt(v)}</text>`;
  vals.forEach((v,i)=>{const x=pl+bw*i+bw*.18,w=bw*.64,y0=y(0),y1=y(v);g+=`<rect x="${x}" y="${Math.min(y0,y1)}" width="${w}" height="${Math.max(1,Math.abs(y1-y0))}" rx="3" fill="${v>=0?'var(--good)':'var(--bad)'}"><title>${esc(labels[i])}: ${fmt(v)}</title></rect><text x="${x+w/2}" y="${H-6}" text-anchor="middle">${esc(labels[i])}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}

    {name:'יעד גדול '+f.goal.v,color:'var(--c4)',vals:fc.map(()=>f.goal.v),dash:true,w:1.5}],fc.map(r=>r.label))}</div>`;
  h+=`<div class="card"><h3>יתרת מזומן צפויה</h3>${lineChart([{name:'מזומן בסוף החודש',color:'var(--c2)',vals:fc.map(r=>r.cash),dots:true,w:3,dotColor:v=>v<0?'var(--bad)':'var(--c2)'}],fc.map(r=>r.label),{zero:true,fmt:v=>Math.abs(v)>=1000?(v/1000).toFixed(0)+'K':fmtN(v)})}<p class="small muted" style="margin:6px 0 0">כולל חיובי ארנונה בכרטיס${S.scen.mode==='migdal'?' ודמי תיווך חד-פעמיים':''}.</p></div>`;

  const ex=S.exp.filter(e=>e.v>0).sort((a,b)=>b.v-a.v),mxE=ex[0]?ex[0].v:1;
  h+=`<div class="card"><h3>לאן הולך הכסף (חודשי)</h3><div class="hbar">${ex.map(e=>`<span>${esc(e.label)}</span><span class="tr"><i style="width:${e.v/mxE*100}%;${e.role==='rent'?'background:var(--c1)':''}"></i></span><span class="num small">${nis(e.v)}</span>`).join('')}</div><p class="small muted" style="margin:8px 0 0">השכירות לבדה = ${Math.round(S.exp.find(e=>e.role==='rent').v/f.avg.v)} מנויים ממוצעים.</p></div></div>`;
  h+=`<h2>טבלת תחזית</h2><div class="card tbl"><table><tr><th>חודש</th><th>מתאמנים</th><th>איזון</th><th>הכנסות</th><th>הוצאות</th><th>רווח</th><th>חובות/חד-פעמי</th><th>מזומן</th></tr>${fc.map(r=>`<tr><td>${r.label}</td><td class="num">${r.t}</td><td class="num">${r.be}</td><td class="num">${nis(r.inc)}</td><td class="num">${nis(r.exp)}</td><td class="num ${r.profit>=0?'pos':'neg'}">${nis(r.profit)}</td><td class="num">${r.dp+r.one?nis(-(r.dp+r.one)):'–'}</td><td class="num ${r.cash>=0?'':'neg'}"><b>${nis(r.cash)}</b></td></tr>`).join('')}</table></div>`;
  return h;
}
function morningList(ms){
  if(!ms.length)return `<p class="muted">אין כרגע פעולות גיוס/שימור פתוחות. הוסף לידים או משימות.</p>`;
  return ms.map((m,i)=>{
    const c=m.kind==='c'?S.contacts.find(x=>x.id===m.ref):null;
    return `<div class="mitem ${m.done?'done':''}"><span class="mnum">${i+1}</span><div class="mtxt" style="flex:1"><b>${esc(m.text)}</b><div class="small muted">${esc(m.why)}</div><div class="row" style="margin-top:5px">${m.done?'<span class="pos small">✓ בוצע</span>':`<button class="btn sm pri" data-act="mDone" data-i="${i}">✓ בוצע</button>`}${c?`<button class="btn sm" data-act="msg" data-id="${c.id}">✉ נסח הודעה</button><button class="btn sm" data-act="openC" data-id="${c.id}">כרטיס</button>`:''}</div></div></div>`;
  }).join('')+`<div class="row" style="margin-top:6px"><button class="btn sm" data-act="mRefresh">↻ חשב מחדש</button><span class="small muted">נבחר פעם ביום לפי השפעה על גיוס ושימור.</span></div>`;
}

/* --- TODAY --- */

  let h=`<div class="grid two"><div class="card morning"><h3>☀️ 3 הפעולות של הבוקר: ${new Date().toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'numeric'})}</h3>${morningList(ms)}</div>`;

/* --- TASKS (kanban) --- */
function vTasks(){
  const top=top20ids();
  let items=S.tasks.filter(vis);
  if(taskFilter.cat)items=items.filter(t=>t.cat===taskFilter.cat);

  items.sort((a,b)=>score(b)-score(a));
  let h=`<div class="row" style="justify-content:space-between;margin-bottom:10px"><h2 style="margin:0">לוח משימות (Kanban)</h2><button class="btn pri" data-act="newT">+ משימה</button></div>`;
  h+=`<div class="chips"><button class="${!taskFilter.cat?'on':''}" data-act="tf" data-k="cat" data-v="">הכל</button>${CATS.map(c=>`<button class="${taskFilter.cat===c?'on':''}" data-act="tf" data-k="cat" data-v="${c}">${c}</button>`).join('')}</div>`;
  h+=`<div class="chips"><button class="${taskFilter.p80?'on':''}" data-act="tf" data-k="p80">🎯 רק 80/20</button>${['A','B','C'].map(p=>`<button class="${taskFilter.pri===p?'on':''}" data-act="tf" data-k="pri" data-v="${p}">${{A:'🔴 A חשוב',B:'🟡 B בינוני',C:'⚪ C כשמשעמם'}[p]}</button>`).join('')}</div>`;
  h+=`<p class="small muted" style="margin-top:0">מסודר לפי ציון השפעה = השפעה² × (6 − מאמץ). ה-20% העליונים מהמשימות הפתוחות מסומנים <span class="p80">80/20</span>. גרור כרטיס בין עמודות או בחר סטטוס.</p>`;
  h+=kanban(TSTAT,items,t=>`<div class="kcard ${t.sample?'samp':''}" draggable="true" data-kind="task" data-id="${t.id}"><div class="kt">${top.has(t.id)&&t.status!=='done'?'<span class="p80">80/20</span> ':''}${esc(t.title)}</div><div class="km"><span class="pri-${t.pri}">${t.pri}</span><span class="tag">${t.cat}</span><span class="tag" title="ציון השפעה">⚡${score(t)}</span>${t.due?`<span class="due ${t.status==='done'?'':dueCls(t.due)}">📅 ${dShort(t.due)}</span>`:''}${t.sample?'<span class="badge b-sample">דוגמה</span>':''}</div><div class="km" style="margin-top:5px"><select data-act="tStat" data-id="${t.id}">${TSTAT.map(s=>`<option value="${s.id}" ${s.id===t.status?'selected':''}>${s.l}</option>`).join('')}</select><button class="btn sm" data-act="editT" data-id="${t.id}">✎</button></div></div>`,'task');
  return h;
}
function kanban(cols,items,card,kind){
  return `<div class="kanban" style="--cols:${cols.length}">`+cols.map(c=>{const its=items.filter(i=>i.status===c.id);return `<div class="kcol" data-drop="${kind}" data-col="${esc(c.id)}"><h4><span>${esc(c.l)}</span><span class="muted">${its.length}</span></h4>${its.map(card).join('')}</div>`}).join('')+`</div>`;
}

function findDup(name,phone,selfId){
  const n=normName(name),p=normPhone(phone);
  for(const c of S.contacts){
    if(c.id===selfId)continue;
    const cp=normPhone(c.phone);
    if(p.length>=7&&cp===p)return {c,why:'אותו מספר טלפון'};
    if(normName(c.name)===n&&!(p&&cp&&p!==cp))return {c,why:'אותו שם'};
  }
  return null;
}
function taskForm(t,dupMsg){
  const isNew=!S.tasks.some(x=>x.id===t.id);
  openDlg(`<h3>${isNew?'משימה חדשה':'עריכת משימה'}</h3><form data-form="task" data-id="${t.id||''}">
  <label>כותרת *</label><input type="text" name="title" required value="${esc(t.title)}">
  <label>קטגוריה</label><select name="cat">${CATS.map(c=>`<option ${c===t.cat?'selected':''}>${c}</option>`).join('')}</select>
  <label>עדיפות</label><select name="pri"><option value="A" ${t.pri==='A'?'selected':''}>🔴 A חשוב (מהלך גדול: 5+ מתאמנים או ₪1,000+ בחודש)</option><option value="B" ${t.pri==='B'?'selected':''}>🟡 B בינוני</option><option value="C" ${t.pri==='C'?'selected':''}>⚪ C כשמשעמם</option></select>
  <label>השפעה עסקית (1–5)</label><input type="number" name="impact" min="1" max="5" value="${t.impact}">
  <label>מאמץ (1 = פחות מ-3 דקות, 5 = ימים)</label><input type="number" name="effort" min="1" max="5" value="${t.effort}">
  <label>תאריך יעד</label><input type="date" name="due" value="${esc(t.due)}">
  <label>סטטוס</label><select name="status">${TSTAT.map(s=>`<option value="${s.id}" ${s.id===t.status?'selected':''}>${s.l}</option>`).join('')}</select>
  <label>הערות</label><textarea name="notes" rows="2">${esc(t.notes)}</textarea>
  <label class="row"><input type="checkbox" name="sample" ${t.sample?'checked':''}> משימת דוגמה</label>
  ${dupMsg?`<div class="notice red dup">${dupMsg}</div>`:''}
  <div class="acts"><button class="btn pri" type="submit">שמור</button>${!isNew?`<button class="btn" type="button" data-act="delT" data-id="${t.id}">🗑 מחק</button>`:''}<button class="btn" type="button" data-act="close">ביטול</button></div></form>`);
}
function msgTemplate(c){
  const first=c.name.split(/[ (:]/)[0];
  if(c.type==='lead')return `היי ${first}, כאן נתנאל מ-Jew Jitsu Ashkelon 🥋\nרציתי לבדוק אם נוח לך לקבוע שיעור ניסיון השבוע?\nשיעור ניסיון בתיאום מראש ₪25, ומקוזז מהמנוי אם נרשמים באותו שבוע.`;
  if(c.type==='active')return `היי ${first}, מתגעגעים אליך על המזרן 💪\nהכל בסדר? אם השעות לא מסתדרות, תגיד לי ונמצא פתרון.`;
  if(c.type==='past')return `היי ${first}, כאן נתנאל מ-Jew Jitsu Ashkelon.\nעבר זמן! נשמח לראות אותך שוב על המזרן. רוצה לבוא לאימון השבוע?`;
  return `שלום ${first}, כאן נתנאל מ-Jew Jitsu Ashkelon.\n`;
}
function msgDlg(c){
  const ph=normPhone(c.phone);
  openDlg(`<h3>✉ טיוטת הודעה ל${esc(c.name)}</h3><div class="notice">שום הודעה לא נשלחת מכאן אוטומטית. רק אחרי שתסמן אישור אפשר להעתיק או לפתוח את וואטסאפ, ושם אתה לוחץ "שלח" בעצמך.</div>
  <label class="small muted" style="display:block;margin-top:8px">נוסח (אפשר לערוך)</label><textarea id="msgTxt" rows="6" style="width:100%">${esc(msgTemplate(c))}</textarea>
  <label class="row" style="margin-top:8px"><input type="checkbox" id="msgOk"> קראתי ואני מאשר/ת לשלוח את ההודעה הזו ל${esc(c.name)}</label>
  <div class="acts"><button class="btn" id="msgCopy" disabled data-act="msgCopy" data-id="${c.id}">📋 העתק</button><button class="btn pri" id="msgWa" disabled data-act="msgWa" data-id="${c.id}" ${ph.length<9?'title="אין מספר טלפון"':''}>פתח בוואטסאפ</button><button class="btn" data-act="close">סגור</button></div>`);
  $('#msgOk').onchange=e=>{$('#msgCopy').disabled=!e.target.checked;$('#msgWa').disabled=!e.target.checked||ph.length<9};
}

/* ---------- actions ---------- */
function setVal(p,v){const o=ref(p);if(!o||!Number.isFinite(v))return;const old=o.v;o.v=(p==='f.cash')?Math.round(v):Math.max(0,Math.round(v));if(o.v===old)return;
  if(p==='f.trainees'&&o.src==='sample')o.src='unverified';
  commit(`${o.label}: ${fmtN(old)} → ${fmtN(o.v)}`,'v:'+p)}
function moveTask(id,st){const t=S.tasks.find(x=>x.id===id);if(!t||t.status===st)return;const old=t.status;t.status=st;t.doneAt=st==='done'?today():'';
  const m=(S.morning[today()]||[]).find(x=>x.kind==='t'&&x.ref===id);if(m)m.done=st==='done';
  commit(`משימה "${t.title}": ${TSTAT.find(s=>s.id===old).l} → ${TSTAT.find(s=>s.id===st).l}`,'',id)}
function convertLead(c){
  c.type='active';c.status='פעיל';c.follow=addDays(today(),7);
  S.f.trainees.v+=1;
  log(`${c.name} נרשם/ה: הועבר/ה למתאמנים פעילים, מונה המתאמנים ${S.f.trainees.v-1} → ${S.f.trainees.v}`,'',c.id);
  commit();
  if(!c.pref){setTimeout(()=>{const p=prompt(`באילו ימים ושעות ${c.name} מעדיף/ה להתאמן?`);if(p){c.pref=p;commit(`נשמרו שעות מועדפות ל${c.name}: ${p}`,'',c.id)}},50)}
}
function moveLead(id,st){const c=S.contacts.find(x=>x.id===id);if(!c||c.status===st)return;
  if(st==='נרשם'){if(confirm(`${c.name} נרשם/ה? להעביר למתאמנים פעילים ולהוסיף 1 למונה המתאמנים?`)){convertLead(c);return}}
  const old=c.status;c.status=st;commit(`${c.name}: ${old} → ${st}`,'',id)}
function download(name,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,id=el.dataset.id;
  if(['tDone','setv','setm','scenv','buffer','moveIdx','tStat'].includes(a))return; // handled by change
  if(el.tagName==='LABEL')return;
  e.preventDefault();
  switch(a){
    case 'tab':TAB=el.dataset.t;closeDlg();render();scrollTo(0,0);break;
    case 'inc':{const o=ref(el.dataset.p);setVal(el.dataset.p,o.v+(+el.dataset.d)*(o.step||1));break}
    case 'edit':{const o=ref(el.dataset.p);const v=prompt(`${o.label}: ערך חדש`,o.v);if(v!==null&&v.trim()!=='')setVal(el.dataset.p,Number(v.replace(/[^\d.-]/g,'')));break}
    case 'src':{const o=ref(el.dataset.p);const order=['sample','unverified','verified'];const old=o.src;o.src=order[(order.indexOf(o.src)+1)%3];commit(`${o.label}: מקור ${SRC[old]} → ${SRC[o.src]}`,'s:'+el.dataset.p);break}
    case 'adoptBE':{const be=breakEven(false),old=S.f.target.v;S.f.target.v=be;S.f.target.src=worst(expSrc(),S.f.avg.src);commit(`יעד איזון: ${old} → ${be} (חושב מהכספים)`);break}
    case 'scen':S.scen.mode=el.dataset.m;commit(`תרחיש תחזית: ${S.scen.mode==='mall'?'נשארים בקניון':'מעבר למגדל'}`,'scen');break;
    case 'mDone':{const m=morning()[+el.dataset.i];m.done=true;
      if(m.kind==='t'){const t=S.tasks.find(x=>x.id===m.ref);if(t&&t.status!=='done'){t.status='done';t.doneAt=today()}}
      else{const c=S.contacts.find(x=>x.id===m.ref);if(c)c.follow=addDays(today(),3)}
      commit(`☀️ בוצעה פעולת בוקר: ${m.text}`,'',m.ref);break}
    case 'mRefresh':morning(true);commit('☀️ 3 פעולות הבוקר חושבו מחדש');break;
    case 'cHandled':{const c=S.contacts.find(x=>x.id===id);c.follow=addDays(today(),3);commit(`📞 טופל מעקב: ${c.name} (מעקב הבא ${dShort(c.follow)})`,'',id);break}
    case 'newT':taskForm({id:'',title:'',cat:taskFilter.cat||'כללי',status:'todo',pri:'B',impact:3,effort:2,due:'',notes:'',sample:false});break;
    case 'editT':taskForm(S.tasks.find(x=>x.id===id));break;
    case 'delT':{const t=S.tasks.find(x=>x.id===id);if(confirm(`למחוק את "${t.title}"?`)){S.tasks=S.tasks.filter(x=>x.id!==id);closeDlg();commit(`🗑 נמחקה משימה: ${t.title}`)}break}
    case 'tf':{const k=el.dataset.k;if(k==='p80')taskFilter.p80=!taskFilter.p80;else taskFilter[k]=taskFilter[k]===el.dataset.v?'':el.dataset.v;render();break}
    case 'crmType':crmType=el.dataset.t;render();break;
    case 'crmView':crmView=el.dataset.v;render();break;
    case 'newC':contactForm({id:'',type:crmType,name:'',phone:'',interest:'',status:TYPES[crmType].st[0],follow:addDays(today(),1),hot:false,notes:'',pref:'',sample:false});break;
    case 'openC':contactForm(S.contacts.find(x=>x.id===id));break;
    case 'delC':{const c=S.contacts.find(x=>x.id===id);if(confirm(`למחוק את ${c.name}?`)){S.contacts=S.contacts.filter(x=>x.id!==id);closeDlg();commit(`🗑 נמחק איש קשר: ${c.name}`)}break}
    case 'convert':{const c=S.contacts.find(x=>x.id===id);closeDlg();convertLead(c);break}
    case 'leave':{const c=S.contacts.find(x=>x.id===id);closeDlg();c.type='past';c.status='עזב';c.follow=addDays(today(),30);
      let t='';if(confirm(`להוריד גם 1 ממונה המתאמנים (${S.f.trainees.v})?`)){S.f.trainees.v=Math.max(0,S.f.trainees.v-1);t=`, מונה המתאמנים → ${S.f.trainees.v}`}
      commit(`${c.name} עזב/ה: הועבר/ה למתאמני עבר${t}`,'',id);break}
    case 'msg':msgDlg(S.contacts.find(x=>x.id===id));break;
    case 'msgCopy':{const c=S.contacts.find(x=>x.id===id),txt=$('#msgTxt').value;navigator.clipboard&&navigator.clipboard.writeText(txt);commit(`✉ אושרה והועתקה הודעה ל${c.name}`,'',id);el.textContent='✓ הועתק';break}
    case 'msgWa':{const c=S.contacts.find(x=>x.id===id),txt=$('#msgTxt').value,p=normPhone(c.phone);window.open('https://wa.me/972'+p.slice(1)+'?text='+encodeURIComponent(txt),'_blank');commit(`✉ אושרה ונפתחה בוואטסאפ הודעה ל${c.name} (השליחה עצמה ידנית)`,'',id);break}
    case 'close':closeDlg();break;
    case 'export':download(`jj-ceo-backup-${today()}.json`,JSON.stringify(S,null,1));log('⬇ נשמר גיבוי לקובץ');save();break;
    case 'import':$('#fileIn').click();break;
    case 'delSamples':{const n=S.contacts.filter(c=>c.sample).length+S.tasks.filter(t=>t.sample).length;if(confirm(`למחוק ${n} רשומות דוגמה (אנשי קשר ומשימות)? נתוני כספים מסוג "דוגמה" יישארו עם התג.`)){S.contacts=S.contacts.filter(c=>!c.sample);S.tasks=S.tasks.filter(t=>!t.sample);S.morning={};commit(`🗑 נמחקו ${n} רשומות דוגמה`)}break}
    case 'reset':if(confirm('לאפס הכל לנתוני ההתחלה? כל השינויים שלך יימחקו (מומלץ לשמור גיבוי קודם).')){S=seed();commit('↺ איפוס לנתוני ההתחלה')}break;
    case 'theme':{const r=document.documentElement,cur=r.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');r.dataset.theme=cur==='dark'?'light':'dark';try{localStorage.setItem(KEY+'_theme',r.dataset.theme)}catch(_){};break}
  }
});
document.addEventListener('change',e=>{
  const el=e.target,a=el.dataset.act;
  if(el.id==='showSample'){S.showSample=el.checked;S.morning={};commit(el.checked?'הוצגו נתוני דוגמה':'הוסתרו נתוני דוגמה');return}
  if(el.id==='fileIn'){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.f||!d.tasks||!d.contacts)throw 0;if(confirm('לטעון את הגיבוי? הנתונים הנוכחיים יוחלפו.')){S=migrate(d);commit('⬆ נטען גיבוי מקובץ '+f.name)}}catch(_){alert('הקובץ אינו גיבוי תקין של הלוח')}el.value=''};r.readAsText(f);return}
  switch(a){
    case 'tDone':moveTask(el.dataset.id,el.checked?'done':'todo');break;
    case 'tStat':moveTask(el.dataset.id,el.value);break;
    case 'setv':setVal(el.dataset.p,Number(el.value));break;
    case 'setm':{const d=S.debts.find(x=>x.id===el.dataset.id);const old=d.monthly;d.monthly=Math.max(0,Number(el.value)||0);commit(`${d.label}: החזר חודשי ${fmtN(old)} → ${fmtN(d.monthly)}`);break}
    case 'scenv':{const k=el.dataset.k,old=S.scen[k];S.scen[k]=Math.max(0,Number(el.value)||0);commit(`תרחיש מגדל (${k}): ${fmtN(old)} → ${fmtN(S.scen[k])}`);break}
    case 'buffer':S.buffer=el.checked;commit(`כרית 10%: ${S.buffer?'פעילה':'כבויה'}`);break;
    case 'moveIdx':S.scen.moveIdx=+el.value;commit(`מעבר למגדל ב-${monthLabel(S.scen.moveIdx)}`,'scen');break;
  }
});
document.addEventListener('input',e=>{if(e.target.id==='crmQ'){crmQ=e.target.value;const pos=e.target.selectionStart;render();const i=$('#crmQ');i.focus();i.setSelectionRange(pos,pos)}});
document.addEventListener('submit',e=>{
  const fm=e.target.closest('form[data-form]');if(!fm)return;e.preventDefault();
  const d=Object.fromEntries(new FormData(fm).entries()),id=fm.dataset.id;
  if(fm.dataset.form==='contact'){
    const name=(d.name||'').trim();if(!name)return;
    const draft={...(S.contacts.find(x=>x.id===id)||{}),...d,name,hot:!!d.hot,sample:!!d.sample,id:id||''};
    const dup=findDup(name,d.phone,id);
    if(dup){contactForm(draft,`⛔ כפילות: כבר קיים "${esc(dup.c.name)}" (${TYPES[dup.c.type].one}, ${esc(dup.c.status)}): ${dup.why}. לא נשמר. <button class="btn sm" type="button" data-act="openC" data-id="${dup.c.id}">פתח את הקיים</button>`);return}
    if(id){const c=S.contacts.find(x=>x.id===id);const ch=[];if(c.status!==d.status)ch.push(`סטטוס ${c.status} → ${d.status}`);if(c.type!==d.type)ch.push(`סוג → ${TYPES[d.type].one}`);if(c.follow!==d.follow)ch.push(`מעקב → ${dShort(d.follow)||'ללא'}`);
      Object.assign(c,draft,{id});closeDlg();commit(`✎ עודכן ${name}${ch.length?': '+ch.join(', '):''}`,'',id);
      if(d.type==='lead'&&d.status==='נרשם'&&confirm(`${name} נרשם/ה? להעביר למתאמנים ולהוסיף 1 למונה?`))convertLead(c);}
    else{const c={...draft,id:uid(),created:today()};S.contacts.push(c);closeDlg();commit(`➕ נוסף ${TYPES[c.type].one}: ${name}`,'',c.id)}
  }else{
    const title=(d.title||'').trim();if(!title)return;
    const t0={...(S.tasks.find(x=>x.id===id)||{}),...d,title,impact:Math.min(5,Math.max(1,+d.impact||3)),effort:Math.min(5,Math.max(1,+d.effort||2)),sample:!!d.sample,id};
    const dup=S.tasks.find(x=>x.id!==id&&x.status!=='done'&&normName(x.title)===normName(title));
    if(dup){taskForm(t0,`⛔ כפילות: כבר יש משימה פתוחה בשם הזה ("${esc(dup.title)}"). לא נשמרה.`);return}
    if(id){const t=S.tasks.find(x=>x.id===id);const wasDone=t.status==='done';Object.assign(t,t0);if(t.status==='done'&&!wasDone)t.doneAt=today();if(t.status!=='done')t.doneAt='';closeDlg();commit(`✎ עודכנה משימה: ${title}`,'',id)}
    else{const t={...t0,id:uid(),created:today(),doneAt:t0.status==='done'?today():''};S.tasks.push(t);closeDlg();commit(`➕ נוספה משימה: ${title} (${t.cat}, ${t.pri})`,'',t.id)}
  }
});
// drag & drop for kanban boards
let drag=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest('.kcard[draggable]');if(!c)return;drag={kind:c.dataset.kind,id:c.dataset.id};e.dataTransfer.setData('text/plain',c.dataset.id);e.dataTransfer.effectAllowed='move'});
document.addEventListener('dragover',e=>{const col=e.target.closest('.kcol');if(col&&drag&&col.dataset.drop===drag.kind){e.preventDefault();document.querySelectorAll('.kcol.over').forEach(x=>x!==col&&x.classList.remove('over'));col.classList.add('over')}});
document.addEventListener('dragleave',e=>{const col=e.target.closest('.kcol');if(col&&!col.contains(e.relatedTarget))col.classList.remove('over')});
document.addEventListener('drop',e=>{const col=e.target.closest('.kcol');if(!col||!drag)return;e.preventDefault();const {kind,id}=drag;drag=null;if(col.dataset.drop!==kind)return;if(kind==='task')moveTask(id,col.dataset.col);else moveLead(id,col.dataset.col)});
document.addEventListener('dragend',()=>{drag=null;document.querySelectorAll('.kcol.over').forEach(x=>x.classList.remove('over'))});

try{const th=localStorage.getItem(KEY+'_theme');if(th)document.documentElement.dataset.theme=th}catch(_){}
save();render();
</script>
