<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>פלייר איור Jew Jitsu Ashkelon</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800;900&family=Assistant:wght@600;700;800&display=swap">
<style>
@page{size:A4;margin:0}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Assistant","Liberation Sans",sans-serif;color:#fff}
.sheet{width:210mm;height:297mm;overflow:hidden;position:relative;background:#04060c;display:flex;flex-direction:column;align-items:center}
.art{position:absolute;top:36mm;left:0;right:0;height:240mm;overflow:hidden}
.art img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block}
.art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#04060c 0%,rgba(4,6,12,0) 9%,rgba(4,6,12,0) 66%,rgba(4,6,12,.9) 84%,#04060c 100%)}
.top{position:relative;z-index:1;display:flex;align-items:center;gap:5mm;margin-top:5mm}
.top img{width:34mm;filter:drop-shadow(0 0 5mm rgba(31,111,224,.75))}
.top h1{margin:0;font-family:"Rubik",sans-serif;font-weight:900;font-size:40px;line-height:1;text-shadow:0 1mm 4mm rgba(0,0,0,.8)}
.top .en{font-family:"Rubik",sans-serif;font-weight:800;font-size:15px;letter-spacing:4px;color:#6aa8ff;direction:ltr;text-align:right;margin-top:2mm}
.bottom{position:absolute;z-index:1;inset:auto 11mm 9mm 11mm;display:flex;flex-direction:column;align-items:center;gap:3.5mm}
.list{display:flex;flex-wrap:wrap;justify-content:center;gap:2mm 0;font-family:"Rubik",sans-serif;font-weight:700;font-size:17px}
.list span{padding:0 3.5mm;border-inline-start:2px solid #1f6fe0}
.list span:first-child{border:0}
.cta{font-family:"Rubik",sans-serif;font-weight:900;font-size:32px;text-shadow:0 1mm 3mm #000;line-height:1.1;text-align:center}
.cta small{display:block;font-family:"Assistant",sans-serif;font-weight:700;font-size:16px;color:#9fb8e0;margin-top:1.5mm}
footer{width:100%;background:#fff;color:#04060c;border-radius:5mm;padding:4.5mm 7mm;display:flex;justify-content:space-between;align-items:center;border-bottom:2.5mm solid #1f6fe0}
footer .where{font-family:"Rubik",sans-serif;font-weight:800;font-size:21px}
footer .where small{display:block;font-family:"Assistant",sans-serif;font-weight:700;font-size:14.5px;color:#1f6fe0;margin-top:.5mm}
footer .n{font-family:"Rubik",sans-serif;font-weight:700;font-size:16px;text-align:center}
footer .p{font-family:"Rubik",sans-serif;font-weight:900;font-size:28px;direction:ltr;line-height:1.05}
</style>
</head>
<body>
<div class="sheet">
  <div class="art"><img src="img/fight.png" alt=""></div>
  <div class="top">
    <img src="img/logo-dark.png" alt="Jew Jitsu Ashkelon">
    <div><h1>ג׳ו-ג׳יצו אשקלון</h1><div class="en">JEW JITSU ASHKELON</div></div>
  </div>
  <div class="bottom">
    <div class="list"><span>ג׳יו-ג׳יטסו</span><span>אגרוף קלאסי</span><span>תאילנדי / MMA</span><span>היאבקות</span><span>ילדים</span></div>
    <div class="cta">בואו לאימון ניסיון<small>לכל הגילאים · מתחילים ומתקדמים</small></div>
    <footer>
      <div class="where">📍 אנחנו עכשיו בקניון לב<small>קניון לב אשקלון · קומה עליונה</small></div>
      <div><div class="n">נתנאל</div><div class="p">052-2339675</div></div>
    </footer>
  </div>
</div>
</body>
</html>
