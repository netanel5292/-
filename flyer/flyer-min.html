<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>פלייר מינימלי Jew Jitsu Ashkelon</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800;900&family=Assistant:wght@600;700;800&display=swap">
<style>
@page{size:A4;margin:0}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Assistant","Liberation Sans",sans-serif;color:#fff}
.sheet{width:210mm;height:297mm;overflow:hidden;position:relative;background:#06080f;padding:11mm 11mm 10mm;display:flex;flex-direction:column;align-items:center;gap:6mm}
.sheet::before{content:"";position:absolute;top:-40mm;right:-40mm;width:160mm;height:160mm;border-radius:50%;background:radial-gradient(circle,rgba(31,111,224,.35),transparent 65%)}
.sheet::after{content:"";position:absolute;bottom:-50mm;left:-50mm;width:170mm;height:170mm;border-radius:50%;background:radial-gradient(circle,rgba(31,111,224,.28),transparent 65%)}
.logo{position:relative;z-index:1;background:#fff;border-radius:50%;width:62mm;height:62mm;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2.5mm #1f6fe0,0 0 0 4mm #fff}
.logo img{width:50mm;mix-blend-mode:multiply}
h1{position:relative;z-index:1;margin:0;font-family:"Rubik",sans-serif;font-weight:900;font-size:50px;line-height:1;text-align:center}
.en{position:relative;z-index:1;font-family:"Rubik",sans-serif;font-weight:800;font-size:20px;letter-spacing:5px;color:#5fa0ff;direction:ltr;margin-top:-3mm}
.photos{position:relative;z-index:1;width:100%;display:grid;grid-template-columns:1fr 1fr;gap:4mm;height:112mm}
.ph{position:relative;border-radius:5mm;overflow:hidden;border:1.2mm solid #fff}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.t img{object-position:55% 50%}
.ph.g img{object-position:50% 38%}
.ph span{position:absolute;bottom:0;inset-inline:0;padding:3mm 0 2.5mm;text-align:center;font-family:"Rubik",sans-serif;font-weight:800;font-size:19px;background:linear-gradient(transparent,rgba(6,8,15,.92))}
.list{position:relative;z-index:1;display:flex;flex-wrap:wrap;justify-content:center;gap:2mm 0;font-family:"Rubik",sans-serif;font-weight:700;font-size:17px}
.list span{padding:0 3.5mm;border-inline-start:2px solid #1f6fe0}
.list span:first-child{border:0}
.cta{position:relative;z-index:1;font-family:"Rubik",sans-serif;font-weight:900;font-size:30px;color:#fff;text-align:center;line-height:1.1}
.cta small{display:block;font-family:"Assistant",sans-serif;font-weight:700;font-size:16px;color:#9fb8e0;margin-top:1.5mm}
footer{position:relative;z-index:1;margin-top:auto;width:100%;background:#fff;color:#06080f;border-radius:5mm;padding:4.5mm 7mm;display:flex;justify-content:space-between;align-items:center;border-bottom:2.5mm solid #1f6fe0}
footer .where{font-family:"Rubik",sans-serif;font-weight:800;font-size:21px}
footer .where small{display:block;font-family:"Assistant",sans-serif;font-weight:700;font-size:14.5px;color:#1f6fe0;margin-top:.5mm}
footer .call{text-align:left}
footer .call .n{font-family:"Rubik",sans-serif;font-weight:700;font-size:16px;text-align:center}
footer .call .p{font-family:"Rubik",sans-serif;font-weight:900;font-size:28px;direction:ltr;line-height:1.05}
</style>
</head>
<body>
<div class="sheet">
  <div class="logo"><img src="img/logo.png" alt="Jew Jitsu Ashkelon"></div>
  <h1>ג׳ו-ג׳יצו אשקלון</h1>
  <div class="en">JEW JITSU ASHKELON</div>

  <div class="photos">
    <div class="ph g"><img src="img/grap_duo.jpg" alt=""><span>🤼 היאבקות</span></div>
    <div class="ph t"><img src="img/thai_duo.jpg" alt=""><span>🦵 אגרוף תאילנדי</span></div>
  </div>

  <div class="list"><span>ג׳יו-ג׳יטסו</span><span>אגרוף קלאסי</span><span>תאילנדי / MMA</span><span>היאבקות</span><span>ילדים</span></div>

  <div class="cta">בואו לאימון ניסיון<small>לכל הגילאים · מתחילים ומתקדמים</small></div>

  <footer>
    <div class="where">📍 אנחנו עכשיו בקניון לב<small>קניון לב אשקלון · קומה עליונה</small></div>
    <div class="call"><div class="n">נתנאל</div><div class="p">052-2339675</div></div>
  </footer>
</div>
</body>
</html>
